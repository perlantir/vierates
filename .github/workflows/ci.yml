name: CI

on:
  pull_request:

env:
  DATABASE_URL: "postgresql://vierates:vierates@localhost:54329/vierates?schema=public"
  NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: "pk_test_vierates_ci"
  CLERK_SECRET_KEY: "sk_test_vierates_ci"
  CLERK_WEBHOOK_SECRET: "whsec_vierates_ci"
  STRIPE_SECRET_KEY: "sk_test_vierates_ci"
  STRIPE_WEBHOOK_SECRET: "whsec_vierates_ci"
  TWILIO_ACCOUNT_SID: "AC00000000000000000000000000000000"
  TWILIO_AUTH_TOKEN: "twilio_ci_auth_token"
  TWILIO_VERIFY_SERVICE_SID: "VA00000000000000000000000000000000"
  PUSHER_APP_ID: "pusher_ci_app"
  PUSHER_KEY: "pusher_ci_key"
  PUSHER_SECRET: "pusher_ci_secret"
  PUSHER_CLUSTER: "us2"
  INNGEST_EVENT_KEY: "inngest_ci_event_key"
  INNGEST_SIGNING_KEY: "inngest_ci_signing_key"
  ARRAY_API_KEY: "array_ci_key"
  TRUV_CLIENT_ID: "truv_ci_client"
  TRUV_SECRET: "truv_ci_secret"
  PERSONA_API_KEY: "persona_ci_key"
  ATTOM_KEY: "attom_ci_key"
  SENTRY_DSN: "https://ci@sentry.example/1"
  POSTHOG_KEY: "phc_vierates_ci"
  UPSTASH_REDIS_REST_URL: "https://vierates-ci.upstash.io"
  UPSTASH_REDIS_REST_TOKEN: "upstash_ci_token"
  DEMO_MODE: "true"

jobs:
  verify:
    name: Typecheck, lint, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm prisma:generate
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build

  playwright:
    name: Playwright smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: vierates
          POSTGRES_USER: vierates
          POSTGRES_PASSWORD: vierates
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U vierates -d vierates"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Migrate and seed database
        run: |
          pnpm exec prisma migrate deploy
          pnpm seed
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Smoke test
        run: pnpm test:e2e
