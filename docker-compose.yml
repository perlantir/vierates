services:
  postgres:
    image: postgres:16-alpine
    container_name: vierates-postgres
    environment:
      POSTGRES_DB: vierates
      POSTGRES_USER: vierates
      POSTGRES_PASSWORD: vierates
    ports:
      - "54329:5432"
    volumes:
      - vierates-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vierates -d vierates"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vierates-postgres-data:
